name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build.vs -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build.vs --config Release --parallel

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item build.vs/BIN/Release/* out/ -Recurse -Force
          Get-ChildItem out -Recurse | Format-Table FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: RockstarEditorPlus-${{ github.ref_name }}-${{ github.run_number }}
          path: out/

      # Also publish the binaries to the `builds` branch, so they can be fetched
      # with plain git where the Actions artifact storage is not reachable.
      - name: Publish to builds branch
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0,7)
          $dir = "builds-tmp"
          git config --global user.name  "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git clone --depth 1 --branch builds "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" $dir 2>$null
          if (-not (Test-Path $dir)) {
            New-Item -ItemType Directory $dir | Out-Null
            git -C $dir init -b builds
            git -C $dir remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          }
          $dest = Join-Path $dir "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item out/* $dest -Recurse -Force
          Set-Content (Join-Path $dest "BUILD.txt") "commit $sha run ${{ github.run_number }}"
          git -C $dir add -A
          git -C $dir commit -m "Build $sha (${{ github.ref_name }} #${{ github.run_number }})"
          git -C $dir push origin builds
