name: Build ClothBuilder

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Get CodeWalker
        shell: pwsh
        run: |
          git clone https://github.com/dexyfex/CodeWalker.git cw
          git -C cw checkout 485d56bec00262ed7fa472261cce7bbc6202b96e

      - name: Build
        shell: pwsh
        run: |
          dotnet build ClothBuilder/ClothBuilder.csproj -c Release -o out
          Get-ChildItem out | Format-Table Name, Length

      - name: Smoke test
        shell: pwsh
        run: |
          ./out/ClothBuilder.exe 2>&1 | Out-Host
          exit 0

      - name: Publish to builds branch
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0,7)
          $dir = "builds-tmp"
          git config --global user.name  "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git clone --depth 1 --branch builds "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" $dir 2>$null
          $dest = Join-Path $dir "clothbuilder"
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item out/* $dest -Recurse -Force
          Set-Content (Join-Path $dest "BUILD.txt") "commit $sha run ${{ github.run_number }}"
          git -C $dir add -A
          git -C $dir commit -m "ClothBuilder $sha (#${{ github.run_number }})"
          git -C $dir push origin builds
