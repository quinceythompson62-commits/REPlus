name: Decompile
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  decomp:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Decompile
        shell: pwsh
        run: |
          dotnet tool install -g ilspycmd --version 8.2.0.7535
          New-Item -ItemType Directory out | Out-Null
          Get-ChildItem in -Filter *.dll | ForEach-Object { ilspycmd $_.FullName -o (Join-Path out $_.BaseName) -p }
          Get-ChildItem out -Recurse | Format-Table FullName, Length
      - name: Publish
        shell: pwsh
        run: |
          git config --global user.name  "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git clone --depth 1 --branch builds "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" b 2>$null
          if (Test-Path b/decomp) { Remove-Item b/decomp -Recurse -Force }
          New-Item -ItemType Directory b/decomp | Out-Null
          Copy-Item out/* b/decomp -Recurse -Force
          git -C b add -A
          git -C b commit -m "decomp ${{ github.sha }}"
          git -C b push origin builds
